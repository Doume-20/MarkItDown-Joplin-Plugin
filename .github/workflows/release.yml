name: Release

# Sur chaque tag vX.Y.Z : tests, build, puis publication du fichier .jpl
# dans la release GitHub (installable directement dans Joplin).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/markitdown-import.jpl
          generate_release_notes: true
